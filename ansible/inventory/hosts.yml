# Ansible Inventory 配置文件
# 定义WordPress部署的目标服务器

all:
  vars:
    # 全局变量
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
    ansible_become: true
    ansible_become_method: sudo
    ansible_python_interpreter: /usr/bin/python3
    
    # WordPress相关配置
    wordpress_version: "latest"
    mysql_version: "10.6"
    nginx_version: "latest"
    php_version: "8.1"
    
    # 项目配置
    project_name: "wordpress-site"
    project_dir: "/opt/wordpress"
    backup_dir: "/opt/backups"
    
  children:
    # WordPress服务器组
    wordpress_servers:
      vars:
        # WordPress服务器特定变量
        server_role: "wordpress"
        docker_compose_version: "2.21.0"
        
        # 网络配置
        nginx_port: 80
        mysql_port: 3306
        
        # 安全配置
        firewall_enabled: true
        fail2ban_enabled: true
        
      hosts:
        # 示例主机配置（实际使用时会动态生成）
        # wp_server_example:
        #   ansible_host: 192.168.1.100
        #   ansible_user: root
        #   ansible_password: "{{ vault_password }}"
        #   ansible_port: 22
        #   server_os: centos
        #   server_specs:
        #     cpu: 2
        #     memory: "2GB"
        #     disk: "40GB"
    
    # 开发服务器组（可选）
    development_servers:
      vars:
        server_role: "development"
        wordpress_debug: true
        
      hosts:
        # 开发环境主机配置
        
    # 生产服务器组（可选）
    production_servers:
      vars:
        server_role: "production"
        wordpress_debug: false
        ssl_enabled: true
        
      hosts:
        # 生产环境主机配置
