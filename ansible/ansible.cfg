[defaults]
# 基础配置
inventory = inventory/hosts.yml
remote_user = root
host_key_checking = False
timeout = 30
gathering = smart
fact_caching = memory
fact_caching_timeout = 86400

# 日志配置
log_path = /tmp/ansible.log
display_skipped_hosts = False
display_ok_hosts = True

# 性能优化
pipelining = True
forks = 10
poll_interval = 1

# SSH配置
[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
control_path_dir = /tmp/.ansible-cp
control_path = %(directory)s/%%h-%%p-%%r
pipelining = True
retries = 3

# 权限提升配置
[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

# 颜色配置
[colors]
highlight = white
verbose = blue
warn = bright purple
error = red
debug = dark gray
deprecate = purple
skip = cyan
unreachable = red
ok = green
changed = yellow
diff_add = green
diff_remove = red
diff_lines = cyan
