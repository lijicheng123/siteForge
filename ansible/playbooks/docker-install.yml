---
# 在 Rocky Linux 服务器上安装 Docker 和 Docker Compose
# 专为 Rocky Linux 8/9 优化

- name: 安装Docker和Docker Compose (Rocky Linux专用)
  hosts: all
  gather_facts: yes
  become: yes
  
  vars:
    docker_version: "{{ docker_version | default('27.1.0') }}"
    docker_compose_version: "{{ docker_compose_version | default('2.28.1') }}"
    
  pre_tasks:
    - name: 验证操作系统为 Rocky Linux
      ansible.builtin.fail:
        msg: "此 playbook 仅支持 Rocky Linux 8/9，当前系统: {{ ansible_distribution }} {{ ansible_distribution_version }}"
      when: ansible_distribution != 'Rocky' or ansible_distribution_major_version|int < 8
      
    - name: 显示安装信息
      ansible.builtin.debug:
        msg: |
          开始在 {{ ansible_hostname }} 上安装 Docker
          操作系统: Rocky Linux {{ ansible_distribution_version }}
          Docker 版本: {{ docker_version }}
          Docker Compose 版本: {{ docker_compose_version }}
          
  tasks:
    - name: 移除旧版本 Docker
      ansible.builtin.dnf:
        name:
          - docker
          - docker-client
          - docker-client-latest
          - docker-common
          - docker-latest
          - docker-latest-logrotate
          - docker-logrotate
          - docker-engine
          - podman
          - runc
        state: absent
        
    - name: 安装必要的系统包
      ansible.builtin.dnf:
        name:
          - dnf-utils
          - device-mapper-persistent-data
          - lvm2
          - curl
          - wget
          - ca-certificates
        state: present
        update_cache: yes
        
    - name: 添加 Docker 官方仓库
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/centos/docker-ce.repo
        dest: /etc/yum.repos.d/docker-ce.repo
        mode: '0644'
        
    - name: 安装指定版本的 Docker CE
      ansible.builtin.dnf:
        name:
          - "docker-ce-{{ docker_version }}"
          - "docker-ce-cli-{{ docker_version }}"
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes
        
    - name: 启动并启用 Docker 服务
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: yes
        daemon_reload: yes
        
    - name: 创建 docker 组 (如果不存在)
      ansible.builtin.group:
        name: docker
        state: present
        
    - name: 将当前用户添加到 docker 组
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes
      when: ansible_user != 'root'
      
    - name: 配置 Docker 守护进程
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        mode: '0644'
        content: |
          {
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "20m",
              "max-file": "5"
            },
            "storage-driver": "overlay2",
            "exec-opts": ["native.cgroupdriver=systemd"],
            "live-restore": true,
            "registry-mirrors": [
              "https://xeuonp9s.mirror.aliyuncs.com",
              "https://docker.m.daocloud.io",
              "https://dockerproxy.com"
            ]
          }
      notify: restart docker
      
    - name: 验证 Docker 安装版本
      ansible.builtin.command: docker --version
      register: docker_version_output
      changed_when: false
      
    - name: 验证 Docker Compose 安装版本
      ansible.builtin.command: docker compose version
      register: docker_compose_version_output
      changed_when: false
      
    - name: 短暂暂停以等待 Docker 服务稳定
      ansible.builtin.pause:
        seconds: 3
      
    - name: 测试 Docker 运行 (hello-world)
      ansible.builtin.command: docker run --rm hello-world
      register: docker_test
      changed_when: false
      retries: 3
      delay: 5
      until: docker_test.rc == 0
      
    - name: 创建自定义 Docker 网络
      community.docker.docker_network:
        name: "{{ docker_network_name | default('app_network') }}"
        driver: bridge
        ipam_config:
          - subnet: 172.20.0.0/16
            iprange: 172.20.240.0/20
            gateway: 172.20.0.1
      register: network_creation
      ignore_errors: yes
      
    - name: 显示最终安装结果
      ansible.builtin.debug:
        msg: |
          ========== Docker 环境安装完成 ==========
          主机: {{ ansible_hostname }}
          操作系统: Rocky Linux {{ ansible_distribution_version }}
          Docker 版本: {{ docker_version_output.stdout }}
          Docker Compose 版本: {{ docker_compose_version_output.stdout | trim }}
          Docker 测试: {{ '成功' if docker_test.rc == 0 else '失败' }}
          Docker 网络: {{ '已创建' if not network_creation.failed else '创建失败(可忽略)' }}
          
          注意: 如果您不是 root 用户，需要重新登录以使 docker 组生效。
          ========================================
          
  handlers:
    - name: restart docker
      ansible.builtin.systemd:
        name: docker
        state: restarted
        daemon_reload: yes
        
  post_tasks:
    - name: 最终验证 Docker 守护进程状态
      ansible.builtin.systemd:
        name: docker
      register: final_docker_status
      failed_when: final_docker_status.status.ActiveState != 'active'
      
    - name: 在控制节点生成安装报告
      ansible.builtin.copy:
        content: |
          # Docker 安装报告
          生成时间: {{ ansible_date_time.iso8601 }}
          
          ## 目标服务器
          - 主机名: {{ ansible_hostname }}
          - 操作系统: Rocky Linux {{ ansible_distribution_version }}
          - IP 地址: {{ ansible_default_ipv4.address }}
          - 架构: {{ ansible_architecture }}
          
          ## 安装结果
          - Docker 版本: {{ docker_version_output.stdout }}
          - Docker Compose 版本: {{ docker_compose_version_output.stdout | trim }}
          - 服务状态: {{ final_docker_status.status.ActiveState }}
          - 测试运行: {{ 'PASSED' if docker_test.rc == 0 else 'FAILED' }}
          
          ## 配置信息
          - Docker 服务状态: {{ final_docker_status.status.ActiveState }}
          - 开机自启: {{ final_docker_status.status.UnitFileState }}
          - 用户组: {{ ansible_user }} 已添加到 docker 组
          - 网络: {{ docker_network_name | default('app_network') }}
        dest: "/tmp/docker_install_report_{{ ansible_hostname }}.md"
        mode: '0644'
      delegate_to: localhost