---
# WordPress部署Playbook
# 使用Docker Compose部署完整的WordPress应用栈

- name: 部署WordPress应用栈
  hosts: all
  gather_facts: yes
  become: yes
  
  vars:
    # 项目配置
    project_name: "{{ wordpress_config.site_name | default('wordpress-site') | regex_replace('[^a-zA-Z0-9]', '-') | lower }}"
    project_dir: "{{ project_dir | default('/opt/wordpress') }}"
    
    # WordPress配置
    wp_site_name: "{{ wordpress_config.site_name | default('My WordPress Site') }}"
    wp_admin_user: "{{ wordpress_config.admin_username | default('admin') }}"
    wp_admin_pass: "{{ wordpress_config.admin_password }}"
    wp_admin_email: "{{ wordpress_config.admin_email | default('admin@example.com') }}"
    
    # 数据库配置
    db_name: "{{ wordpress_config.db_name | default('wordpress') }}"
    db_user: "{{ wordpress_config.db_user | default('wpuser') }}"
    db_pass: "{{ wordpress_config.db_password }}"
    db_root_pass: "{{ mysql_root_password | default('changeme123') }}"
    
    # 网络配置
    nginx_port: "{{ nginx.port | default(80) }}"
    
  pre_tasks:
    - name: 验证必要变量
      fail:
        msg: "缺少必要的配置变量: {{ item }}"
      when: vars[item] is not defined or vars[item] == ""
      loop:
        - wp_admin_pass
        - db_pass
        
    - name: 检查Docker是否安装
      command: docker --version
      register: docker_check
      failed_when: docker_check.rc != 0
      changed_when: false
      
    - name: 检查Docker Compose是否安装
      command: docker-compose --version
      register: docker_compose_check
      failed_when: docker_compose_check.rc != 0
      changed_when: false
      
    - name: 显示部署信息
      debug:
        msg: |
          开始部署WordPress应用栈
          项目名称: {{ project_name }}
          部署目录: {{ project_dir }}
          网站名称: {{ wp_site_name }}
          管理员用户: {{ wp_admin_user }}
          数据库名称: {{ db_name }}
          
  tasks:
    - name: 创建项目目录结构
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ project_dir }}"
        - "{{ project_dir }}/nginx"
        - "{{ project_dir }}/mysql"
        - "{{ project_dir }}/wordpress"
        - "{{ project_dir }}/logs"
        - "{{ project_dir }}/backups"
        
    - name: 生成随机密钥
      set_fact:
        wp_auth_key: "{{ lookup('password', '/dev/null length=64 chars=ascii_letters,digits,punctuation') }}"
        wp_secure_auth_key: "{{ lookup('password', '/dev/null length=64 chars=ascii_letters,digits,punctuation') }}"
        wp_logged_in_key: "{{ lookup('password', '/dev/null length=64 chars=ascii_letters,digits,punctuation') }}"
        wp_nonce_key: "{{ lookup('password', '/dev/null length=64 chars=ascii_letters,digits,punctuation') }}"
        wp_auth_salt: "{{ lookup('password', '/dev/null length=64 chars=ascii_letters,digits,punctuation') }}"
        wp_secure_auth_salt: "{{ lookup('password', '/dev/null length=64 chars=ascii_letters,digits,punctuation') }}"
        wp_logged_in_salt: "{{ lookup('password', '/dev/null length=64 chars=ascii_letters,digits,punctuation') }}"
        wp_nonce_salt: "{{ lookup('password', '/dev/null length=64 chars=ascii_letters,digits,punctuation') }}"
        
    - name: 创建Nginx配置文件
      copy:
        content: |
          server {
              listen 80;
              server_name _;
              
              root /var/www/html;
              index index.php index.html index.htm;
              
              client_max_body_size 64M;
              
              location / {
                  try_files $uri $uri/ /index.php?$args;
              }
              
              location ~ \.php$ {
                  fastcgi_split_path_info ^(.+\.php)(/.+)$;
                  fastcgi_pass wordpress:9000;
                  fastcgi_index index.php;
                  include fastcgi_params;
                  fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                  fastcgi_param PATH_INFO $fastcgi_path_info;
                  fastcgi_read_timeout 300;
              }
              
              location ~ /\.ht {
                  deny all;
              }
              
              location = /favicon.ico {
                  log_not_found off;
                  access_log off;
              }
              
              location = /robots.txt {
                  log_not_found off;
                  access_log off;
                  allow all;
              }
              
              location ~* \.(css|gif|ico|jpeg|jpg|js|png)$ {
                  expires 1y;
                  add_header Cache-Control "public, immutable";
              }
          }
        dest: "{{ project_dir }}/nginx/default.conf"
        mode: '0644'
        
    - name: 创建MySQL初始化脚本
      copy:
        content: |
          CREATE DATABASE IF NOT EXISTS {{ db_name }};
          CREATE USER IF NOT EXISTS '{{ db_user }}'@'%' IDENTIFIED BY '{{ db_pass }}';
          GRANT ALL PRIVILEGES ON {{ db_name }}.* TO '{{ db_user }}'@'%';
          FLUSH PRIVILEGES;
        dest: "{{ project_dir }}/mysql/init.sql"
        mode: '0644'
        
    - name: 创建WordPress配置文件
      copy:
        content: |
          <?php
          define('DB_NAME', '{{ db_name }}');
          define('DB_USER', '{{ db_user }}');
          define('DB_PASSWORD', '{{ db_pass }}');
          define('DB_HOST', 'mysql:3306');
          define('DB_CHARSET', 'utf8mb4');
          define('DB_COLLATE', '');
          
          define('AUTH_KEY',         '{{ wp_auth_key }}');
          define('SECURE_AUTH_KEY',  '{{ wp_secure_auth_key }}');
          define('LOGGED_IN_KEY',    '{{ wp_logged_in_key }}');
          define('NONCE_KEY',        '{{ wp_nonce_key }}');
          define('AUTH_SALT',        '{{ wp_auth_salt }}');
          define('SECURE_AUTH_SALT', '{{ wp_secure_auth_salt }}');
          define('LOGGED_IN_SALT',   '{{ wp_logged_in_salt }}');
          define('NONCE_SALT',       '{{ wp_nonce_salt }}');
          
          $table_prefix = '{{ wordpress.table_prefix | default("wp_") }}';
          
          define('WP_DEBUG', {{ wordpress.debug | default(false) | lower }});
          define('WP_DEBUG_LOG', {{ wordpress.debug | default(false) | lower }});
          define('WP_DEBUG_DISPLAY', false);
          
          define('AUTOMATIC_UPDATER_DISABLED', false);
          define('WP_AUTO_UPDATE_CORE', true);
          
          if ( ! defined( 'ABSPATH' ) ) {
              define( 'ABSPATH', __DIR__ . '/' );
          }
          
          require_once ABSPATH . 'wp-settings.php';
        dest: "{{ project_dir }}/wordpress/wp-config.php"
        mode: '0644'
        
    - name: 创建Docker Compose文件
      copy:
        content: |
          version: '3.8'
          
          services:
            nginx:
              image: nginx:{{ nginx.version | default('latest') }}
              container_name: {{ project_name }}_nginx
              restart: unless-stopped
              ports:
                - "{{ nginx_port }}:80"
              volumes:
                - wordpress_data:/var/www/html
                - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
                - ./logs/nginx:/var/log/nginx
              depends_on:
                - wordpress
              networks:
                - wordpress_network
                
            mysql:
              image: mariadb:{{ mysql.version | default('10.6') }}
              container_name: {{ project_name }}_mysql
              restart: unless-stopped
              environment:
                MYSQL_ROOT_PASSWORD: {{ db_root_pass }}
                MYSQL_DATABASE: {{ db_name }}
                MYSQL_USER: {{ db_user }}
                MYSQL_PASSWORD: {{ db_pass }}
              volumes:
                - mysql_data:/var/lib/mysql
                - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
                - ./logs/mysql:/var/log/mysql
              networks:
                - wordpress_network
              command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
              
            wordpress:
              image: wordpress:{{ wordpress.version | default('latest') }}-fpm
              container_name: {{ project_name }}_wordpress
              restart: unless-stopped
              environment:
                WORDPRESS_DB_HOST: mysql:3306
                WORDPRESS_DB_NAME: {{ db_name }}
                WORDPRESS_DB_USER: {{ db_user }}
                WORDPRESS_DB_PASSWORD: {{ db_pass }}
                WORDPRESS_TABLE_PREFIX: {{ wordpress.table_prefix | default('wp_') }}
                WORDPRESS_DEBUG: {{ wordpress.debug | default(false) | lower }}
              volumes:
                - wordpress_data:/var/www/html
                - ./wordpress/wp-config.php:/var/www/html/wp-config.php
                - ./logs/wordpress:/var/log/wordpress
              depends_on:
                - mysql
              networks:
                - wordpress_network
                
            wp_cli:
              image: wordpress:cli
              container_name: {{ project_name }}_wp_cli
              restart: "no"
              environment:
                WORDPRESS_DB_HOST: mysql:3306
                WORDPRESS_DB_NAME: {{ db_name }}
                WORDPRESS_DB_USER: {{ db_user }}
                WORDPRESS_DB_PASSWORD: {{ db_pass }}
              volumes:
                - wordpress_data:/var/www/html
              depends_on:
                - mysql
                - wordpress
              networks:
                - wordpress_network
              command: tail -f /dev/null
              
          volumes:
            mysql_data:
              driver: local
            wordpress_data:
              driver: local
              
          networks:
            wordpress_network:
              driver: bridge
        dest: "{{ project_dir }}/docker-compose.yml"
        mode: '0644'
        
    - name: 停止可能存在的旧容器
      shell: |
        cd {{ project_dir }}
        docker-compose down --remove-orphans || true
      ignore_errors: yes
      
    - name: 拉取Docker镜像
      shell: |
        cd {{ project_dir }}
        docker-compose pull
      register: pull_result
      
    - name: 启动WordPress应用栈
      shell: |
        cd {{ project_dir }}
        docker-compose up -d
      register: compose_up
      
    - name: 等待MySQL服务就绪
      wait_for:
        port: 3306
        host: "{{ ansible_default_ipv4.address }}"
        timeout: 60
        delay: 10
        
    - name: 等待WordPress服务就绪
      wait_for:
        port: "{{ nginx_port }}"
        host: "{{ ansible_default_ipv4.address }}"
        timeout: 120
        delay: 15
        
    - name: 初始化WordPress
      shell: |
        cd {{ project_dir }}
        docker-compose exec -T wp_cli wp core install \
          --url="http://{{ ansible_default_ipv4.address }}" \
          --title="{{ wp_site_name }}" \
          --admin_user="{{ wp_admin_user }}" \
          --admin_password="{{ wp_admin_pass }}" \
          --admin_email="{{ wp_admin_email }}" \
          --allow-root
      register: wp_install
      retries: 3
      delay: 10
      
    - name: 设置WordPress基本配置
      shell: |
        cd {{ project_dir }}
        # 设置时区
        docker-compose exec -T wp_cli wp option update timezone_string "{{ timezone | default('Asia/Shanghai') }}" --allow-root
        
        # 设置日期格式
        docker-compose exec -T wp_cli wp option update date_format "Y-m-d" --allow-root
        docker-compose exec -T wp_cli wp option update time_format "H:i" --allow-root
        
        # 禁用不必要的插件
        docker-compose exec -T wp_cli wp plugin delete hello --allow-root || true
        docker-compose exec -T wp_cli wp plugin delete akismet --allow-root || true
        
        # 删除示例内容
        docker-compose exec -T wp_cli wp post delete 1 --force --allow-root || true
        docker-compose exec -T wp_cli wp post delete 2 --force --allow-root || true
        docker-compose exec -T wp_cli wp comment delete 1 --force --allow-root || true
      ignore_errors: yes
      
    - name: 验证WordPress安装
      uri:
        url: "http://{{ ansible_default_ipv4.address }}:{{ nginx_port }}"
        method: GET
        status_code: 200
      register: wp_check
      retries: 3
      delay: 10
      
    - name: 创建备份脚本
      copy:
        content: |
          #!/bin/bash
          # WordPress自动备份脚本
          
          BACKUP_DIR="{{ project_dir }}/backups"
          DATE=$(date +%Y%m%d_%H%M%S)
          PROJECT_DIR="{{ project_dir }}"
          
          # 创建备份目录
          mkdir -p $BACKUP_DIR
          
          # 备份数据库
          cd $PROJECT_DIR
          docker-compose exec -T mysql mysqldump -u root -p{{ db_root_pass }} {{ db_name }} > $BACKUP_DIR/database_$DATE.sql
          
          # 备份WordPress文件
          docker run --rm -v wordpress_data:/data -v $BACKUP_DIR:/backup alpine tar czf /backup/wordpress_files_$DATE.tar.gz -C /data .
          
          # 清理7天前的备份
          find $BACKUP_DIR -name "*.sql" -mtime +7 -delete
          find $BACKUP_DIR -name "*.tar.gz" -mtime +7 -delete
          
          echo "备份完成: $DATE"
        dest: "{{ project_dir }}/backup.sh"
        mode: '0755'
        
    - name: 设置备份定时任务
      cron:
        name: "WordPress自动备份"
        minute: "0"
        hour: "2"
        job: "{{ project_dir }}/backup.sh >> {{ project_dir }}/logs/backup.log 2>&1"
      when: backup.enabled | default(true)
      
    - name: 显示部署结果
      debug:
        msg: |
          ========== WordPress部署完成 ==========
          网站地址: http://{{ ansible_default_ipv4.address }}:{{ nginx_port }}
          管理后台: http://{{ ansible_default_ipv4.address }}:{{ nginx_port }}/wp-admin
          
          管理员信息:
          - 用户名: {{ wp_admin_user }}
          - 密码: {{ wp_admin_pass }}
          - 邮箱: {{ wp_admin_email }}
          
          数据库信息:
          - 数据库名: {{ db_name }}
          - 用户名: {{ db_user }}
          - 密码: {{ db_pass }}
          
          项目目录: {{ project_dir }}
          备份目录: {{ project_dir }}/backups
          日志目录: {{ project_dir }}/logs
          
  handlers:
    - name: restart docker
      systemd:
        name: docker
        state: restarted
        
  post_tasks:
    - name: 创建部署报告
      copy:
        content: |
          # WordPress部署报告 - {{ ansible_date_time.iso8601 }}
          
          ## 服务器信息
          - 主机名: {{ ansible_hostname }}
          - IP地址: {{ ansible_default_ipv4.address }}
          - 操作系统: {{ ansible_distribution }} {{ ansible_distribution_version }}
          
          ## 部署信息
          - 项目名称: {{ project_name }}
          - 部署目录: {{ project_dir }}
          - 网站地址: http://{{ ansible_default_ipv4.address }}:{{ nginx_port }}
          - 管理后台: http://{{ ansible_default_ipv4.address }}:{{ nginx_port }}/wp-admin
          
          ## 配置信息
          - 网站名称: {{ wp_site_name }}
          - 管理员用户: {{ wp_admin_user }}
          - 管理员邮箱: {{ wp_admin_email }}
          - 数据库名称: {{ db_name }}
          - 数据库用户: {{ db_user }}
          
          ## 服务状态
          - Nginx: 运行中 (端口 {{ nginx_port }})
          - MySQL: 运行中 (端口 3306)
          - WordPress: 运行中
          - 备份任务: {{ '已启用' if backup.enabled | default(true) else '已禁用' }}
          
        dest: "/tmp/wordpress_deploy_{{ ansible_hostname }}_{{ ansible_date_time.epoch }}.txt"
        mode: '0644'
      delegate_to: localhost
