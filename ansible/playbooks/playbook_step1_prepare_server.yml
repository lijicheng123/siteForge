---
# ============================================================================
# Playbook Step 1: 服务器环境准备（裸金属 LEMP 栈）
# ============================================================================
# 目标: 在 Rocky Linux 服务器上安装和配置完整的 LEMP 环境
# 
# 必需的 extra-vars 参数:
#   - target_host: 目标服务器 IP 地址
#   - ssh_user: SSH 登录用户名
#   - site_domain: 网站域名 (例如: example.com)
#   - mysql_root_password: MySQL root 用户密码
#   - db_name: WordPress 数据库名
#   - db_user: WordPress 数据库用户名
#   - db_password: WordPress 数据库用户密码
#
# 执行示例:
#   ansible-playbook -i inventory.yml playbook_step1_prepare_server.yml \
#     --extra-vars '{"target_host":"1.2.3.4","ssh_user":"root",...}'
# ============================================================================

- name: "Step 1: 准备 Rocky Linux 服务器环境 (LEMP)"
  hosts: all
  become: true
  gather_facts: true
  
  # ============================================================================
  # 前置检查：确保目标系统是 Rocky Linux
  # ============================================================================
  pre_tasks:
    - name: "前置检查 | 验证操作系统类型"
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Rocky"
        fail_msg: "此 Playbook 仅支持 Rocky Linux 系统，当前系统: {{ ansible_distribution }}"
        success_msg: "系统验证通过: {{ ansible_distribution }} {{ ansible_distribution_version }}"
    
    - name: "前置检查 | 显示服务器基本信息"
      ansible.builtin.debug:
        msg:
          - "目标服务器: {{ ansible_hostname }}"
          - "操作系统: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "架构: {{ ansible_architecture }}"
          - "CPU 核心数: {{ ansible_processor_vcpus }}"
          - "内存: {{ (ansible_memtotal_mb / 1024) | round(2) }} GB"
    
    # --------------------------------------------------------------------------
    # 清理可能存在的错误仓库配置（从之前的运行中残留）
    # 必须在更新缓存之前执行，否则会因为错误的仓库配置导致缓存更新失败
    # --------------------------------------------------------------------------
    - name: "清理 | 移除可能存在的错误 MariaDB 仓库配置"
      ansible.builtin.file:
        path: "/etc/yum.repos.d/mariadb.repo"
        state: absent
      tags: ['cleanup', 'repos']
    
    - name: "前置检查 | 更新系统包缓存"
      ansible.builtin.dnf:
        update_cache: true
      changed_when: false
    
    # --------------------------------------------------------------------------
    # 配置国内镜像源（清华大学开源镜像站）
    # --------------------------------------------------------------------------
    - name: "镜像配置 | 配置 EPEL 清华镜像源"
      ansible.builtin.yum_repository:
        name: epel
        description: Extra Packages for Enterprise Linux $releasever - $basearch
        baseurl: https://mirrors.tuna.tsinghua.edu.cn/epel/$releasever/Everything/$basearch/
        enabled: true
        gpgcheck: true
        gpgkey: https://mirrors.tuna.tsinghua.edu.cn/epel/RPM-GPG-KEY-EPEL-$releasever
        metalink: ""
      tags: ['epel', 'repos', 'mirrors']
    
    # --------------------------------------------------------------------------
    # 关键任务：配置 Remi 仓库并启用 PHP 8.3 模块（必须在 PHP 角色执行前完成）
    # 使用清华镜像加速下载
    # --------------------------------------------------------------------------
    - name: "PHP 准备 | 从清华镜像下载 Remi 仓库 RPM"
      ansible.builtin.get_url:
        url: "https://mirrors.tuna.tsinghua.edu.cn/remi/enterprise/remi-release-{{ ansible_distribution_major_version }}.rpm"
        dest: "/tmp/remi-release-{{ ansible_distribution_major_version }}.rpm"
        mode: '0644'
        timeout: 180
      tags: ['php', 'remi', 'mirrors']
    
    - name: "PHP 准备 | 安装 Remi 仓库 RPM"
      ansible.builtin.dnf:
        name: "/tmp/remi-release-{{ ansible_distribution_major_version }}.rpm"
        state: present
        disable_gpg_check: true
      tags: ['php', 'remi']
    
    - name: "PHP 准备 | 配置 Remi 仓库使用清华镜像"
      ansible.builtin.replace:
        path: "/etc/yum.repos.d/remi.repo"
        regexp: '^(mirrorlist=.*)$'
        replace: '#\1'
      tags: ['php', 'remi', 'mirrors']
    
    - name: "PHP 准备 | 设置 Remi 仓库 baseurl 为清华镜像"
      ansible.builtin.replace:
        path: "/etc/yum.repos.d/remi.repo"
        regexp: '^#baseurl=http://rpms\.remirepo\.net/'
        replace: 'baseurl=https://mirrors.tuna.tsinghua.edu.cn/remi/'
      tags: ['php', 'remi', 'mirrors']
    
    - name: "PHP 准备 | 配置 Remi PHP 8.3 仓库使用清华镜像"
      ansible.builtin.replace:
        path: "/etc/yum.repos.d/remi-modular.repo"
        regexp: '^(mirrorlist=.*)$'
        replace: '#\1'
      tags: ['php', 'remi', 'mirrors']
    
    - name: "PHP 准备 | 设置 Remi PHP 8.3 baseurl 为清华镜像"
      ansible.builtin.replace:
        path: "/etc/yum.repos.d/remi-modular.repo"
        regexp: '^#baseurl=http://rpms\.remirepo\.net/'
        replace: 'baseurl=https://mirrors.tuna.tsinghua.edu.cn/remi/'
      tags: ['php', 'remi', 'mirrors']
    
    - name: "PHP 准备 | 重置 PHP 模块"
      ansible.builtin.command: dnf module reset php -y
      register: php_module_reset
      changed_when: "'Resetting' in php_module_reset.stdout"
      failed_when: false
      tags: ['php', 'remi']

    - name: "PHP 准备 | 启用 Remi PHP 8.3 模块"
      ansible.builtin.command: dnf module enable php:remi-8.3 -y
      register: php_module_enable
      changed_when: "'Enabling' in php_module_enable.stdout"
      failed_when: false
      tags: ['php', 'remi']
    
    - name: "PHP 准备 | 清理 DNF 缓存（确保角色使用最新仓库数据）"
      ansible.builtin.command: dnf clean all
      changed_when: true
      tags: ['php', 'remi']

  # ============================================================================
  # 角色变量配置
  # ============================================================================
  vars:
    # --------------------------------------------------------------------------
    # PHP 8.3 配置（使用 Remi 仓库）
    # --------------------------------------------------------------------------
    php_version: "8.3"
    php_packages_state: "latest"
    php_webserver_daemon: "nginx"
    php_enablerepo: "remi-{{ php_version | replace('.', '') }}"
    
    # PHP Versions Role 配置（用于安装 Remi 仓库）
    php_versions_install_recommends: false
    php_default_version_debian: "8.3"
    php_default_version_redhat: "8.3"
    
    # PHP 核心扩展
    php_packages:
      - php
      - php-cli
      - php-common
      - php-fpm
      - php-mysqlnd
      - php-gd
      - php-xml
      - php-mbstring
      - php-opcache
      - php-curl
      - php-zip
      - php-intl
      - php-bcmath
      - php-soap
      - php-pecl-apcu
      # php-xmlrpc 在 Rocky Linux 9 上不可用，已移除
      # php-imagick 需要单独安装 ImageMagick，先移除
    
    # PHP-FPM 配置优化（针对 2核2G 服务器，并发100优化）
    # 计算逻辑：2G内存 - 512M(MySQL) - 256M(Redis) - 400M(系统) = 832M可用
    # 每个PHP-FPM进程约占50-80MB，max_children = 832M / 70M ≈ 11-12
    # 为了并发100，配置为20，但需要配合Nginx缓存减少实际PHP请求
    php_fpm_pools:
      - pool_name: www
        pool_user: apache
        pool_group: apache
        pool_listen: /run/php-fpm/www.sock
        pool_listen_owner: apache
        pool_listen_group: apache
        pool_pm: dynamic
        pool_pm_max_children: 20              # 最大子进程数（2G内存优化值）
        pool_pm_start_servers: 4              # 启动时进程数
        pool_pm_min_spare_servers: 2          # 最小空闲进程数
        pool_pm_max_spare_servers: 8          # 最大空闲进程数
        pool_pm_max_requests: 1000            # 每个进程处理1000请求后重启（防止内存泄漏）
        pool_pm_process_idle_timeout: 30s     # 空闲进程30秒后回收
        pool_request_terminate_timeout: 300   # 单个请求最大执行时间
    
    # php.ini 配置（优化上传和性能）
    php_memory_limit: "256M"                  # 单个脚本内存限制
    php_max_execution_time: "300"             # 最大执行时间5分钟
    php_upload_max_filesize: "64M"            # 上传文件大小限制 64M ✓
    php_post_max_size: "64M"                  # POST数据大小限制 64M ✓
    php_date_timezone: "Asia/Shanghai"
    php_opcache_enable: "1"
    php_opcache_memory_consumption: "256"     # OPcache内存增加到256M
    php_opcache_max_accelerated_files: "20000"  # 增加缓存文件数
    php_opcache_revalidate_freq: "60"         # 每60秒检查一次文件更新
    php_opcache_fast_shutdown: "1"            # 快速关闭
    php_opcache_enable_cli: "0"               # CLI模式禁用（节省内存）
    
    # --------------------------------------------------------------------------
    # Nginx 配置（针对 2核2G 优化）
    # --------------------------------------------------------------------------
    nginx_user: "nginx"
    nginx_worker_processes: "2"               # 2核CPU，设置2个worker
    nginx_worker_connections: "2048"          # 每个worker最大连接数（2核可支持更高）
    nginx_client_max_body_size: "64m"         # 客户端请求体大小 64M ✓
    nginx_keepalive_timeout: "30"             # Keepalive超时30秒（节省连接）
    nginx_keepalive_requests: "100"           # 单个连接最多100个请求
    nginx_remove_default_vhost: true
    
    # Nginx 基础配置（role支持的变量）
    nginx_sendfile: "on"
    nginx_tcp_nopush: "on"
    nginx_tcp_nodelay: "on"
    
    # Nginx额外性能配置（只包含role不支持的指令）
    nginx_extra_http_options: |
      # FastCGI缓冲区优化
      fastcgi_buffers 16 16k;
      fastcgi_buffer_size 32k;
      fastcgi_busy_buffers_size 64k;
      fastcgi_temp_file_write_size 256k;
      
      # Gzip压缩
      gzip on;
      gzip_vary on;
      gzip_comp_level 6;
      gzip_min_length 1000;
      gzip_proxied any;
      gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;
      gzip_disable "msie6";
      
      # 文件缓存
      open_file_cache max=10000 inactive=60s;
      open_file_cache_valid 90s;
      open_file_cache_min_uses 2;
      open_file_cache_errors on;
    
    # 暂不配置虚拟主机，留到 Step 2
    nginx_vhosts: []
    
    # --------------------------------------------------------------------------
    # MySQL/MariaDB 配置（针对 2核2G 服务器优化）
    # 2G内存分配：MySQL占用512M（约25%），预留给InnoDB缓冲池和连接
    # --------------------------------------------------------------------------
    mysql_root_password_update: true
    mysql_enabled_on_startup: true
    
    mysql_databases:
      - name: "{{ db_name }}"
        encoding: utf8mb4
        collation: utf8mb4_unicode_ci
    
    mysql_users:
      - name: "{{ db_user }}"
        password: "{{ db_password }}"
        priv: "{{ db_name }}.*:ALL"
        host: "localhost"
    
    # MariaDB 性能优化（2G内存配置）
    mysql_max_allowed_packet: "64M"             # 允许的最大包大小 64M ✓
    mysql_innodb_buffer_pool_size: "512M"       # InnoDB缓冲池（2G内存的25%）
    mysql_innodb_log_file_size: "128M"          # 日志文件大小
    mysql_innodb_log_buffer_size: "16M"         # 日志缓冲区
    mysql_innodb_flush_log_at_trx_commit: "2"   # 每秒刷新一次日志（性能优化）
    mysql_innodb_flush_method: "O_DIRECT"       # 直接IO，减少系统缓存
    mysql_innodb_file_per_table: "1"            # 每个表独立表空间
    mysql_max_connections: "150"                # 最大连接数（并发100够用）
    mysql_thread_cache_size: "16"               # 线程缓存
    mysql_table_open_cache: "2048"              # 表缓存
    mysql_query_cache_type: "0"                 # 禁用查询缓存（MariaDB 10.11已废弃）
    mysql_tmp_table_size: "32M"                 # 临时表大小
    mysql_max_heap_table_size: "32M"            # 内存表大小
    mysql_sort_buffer_size: "2M"                # 排序缓冲区
    mysql_read_buffer_size: "1M"                # 读缓冲区
    mysql_read_rnd_buffer_size: "2M"            # 随机读缓冲区
    mysql_join_buffer_size: "2M"                # JOIN缓冲区
    mysql_slow_query_log_enabled: true          # 启用慢查询日志
    mysql_slow_query_time: "2"                  # 慢查询阈值2秒
    mysql_long_query_time: "2"                  # 长查询时间
    
    # --------------------------------------------------------------------------
    # 防火墙配置
    # --------------------------------------------------------------------------
    firewall_state: started
    firewall_enabled_at_boot: true
    firewall_allowed_tcp_ports:
      - "22"    # SSH
      - "80"    # HTTP
      - "443"   # HTTPS
    
    # Composer 已移除（WordPress 不需要）

  # ============================================================================
  # 执行角色任务
  # 注意：EPEL、Remi 仓库和 PHP 模块已在 pre_tasks 中配置，确保角色能找到 PHP 8.3
  # ============================================================================
  roles:
    # 1. 配置防火墙（安全第一）
    - role: geerlingguy.firewall
      tags: ['firewall', 'security']
    
    # 2. 安装 Nginx
    - role: geerlingguy.nginx
      tags: ['nginx', 'web']
    
    # 3. 安装 PHP 8.3 和 PHP-FPM
    # 注意：Remi 仓库已在 pre_tasks 中配置完成
    - role: geerlingguy.php
      tags: ['php']
    
    # 4. 安装并配置 MariaDB
    - role: geerlingguy.mysql
      tags: ['mysql', 'database']
    
    # 注意：Composer 已移除
    # WordPress 不需要 Composer，且在中国大陆访问 GitHub 可能受限
  
  # ============================================================================
  # 中间任务：安装 Redis、Fail2Ban 和系统优化
  # （这些任务需要 EPEL 仓库，所以必须在 roles 执行后进行）
  # ============================================================================
  tasks:
    # --------------------------------------------------------------------------
    # 安装 Redis（方案四核心：对象缓存）
    # --------------------------------------------------------------------------
    - name: "性能优化 | 安装 Redis（需要 EPEL 仓库）"
      ansible.builtin.dnf:
        name: redis
        state: present
      tags: ['redis', 'cache', 'performance']
    
    - name: "性能优化 | 配置 Redis（2G内存优化）"
      ansible.builtin.lineinfile:
        path: /etc/redis/redis.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        backup: yes
      loop:
        - { regexp: '^maxmemory ', line: 'maxmemory 256mb' }           # Redis最大内存256M
        - { regexp: '^maxmemory-policy ', line: 'maxmemory-policy allkeys-lru' }  # LRU淘汰策略
        - { regexp: '^save 900', line: '# save 900 1' }                # 禁用RDB持久化（性能优化）
        - { regexp: '^save 300', line: '# save 300 10' }
        - { regexp: '^save 60', line: '# save 60 10000' }
        - { regexp: '^appendonly ', line: 'appendonly no' }            # 禁用AOF（性能优化）
        - { regexp: '^tcp-keepalive ', line: 'tcp-keepalive 60' }      # TCP keepalive
        - { regexp: '^timeout ', line: 'timeout 300' }                 # 连接超时5分钟
      tags: ['redis', 'cache', 'performance']
    
    - name: "性能优化 | 启动并启用 Redis 服务"
      ansible.builtin.systemd:
        name: redis
        state: started
        enabled: true
      tags: ['redis', 'cache', 'performance']
    
    # --------------------------------------------------------------------------
    # 系统内核参数优化（方案四核心）
    # --------------------------------------------------------------------------
    - name: "性能优化 | 配置系统内核参数（针对2核2G优化）"
      ansible.builtin.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: yes
        sysctl_file: /etc/sysctl.d/99-wordpress-performance.conf
      loop:
        # 网络优化（启用 TCP BBR 拥塞控制算法）
        - { name: 'net.core.default_qdisc', value: 'fq' }
        - { name: 'net.ipv4.tcp_congestion_control', value: 'bbr' }
        - { name: 'net.core.rmem_max', value: '16777216' }            # 最大接收缓冲区
        - { name: 'net.core.wmem_max', value: '16777216' }            # 最大发送缓冲区
        - { name: 'net.ipv4.tcp_rmem', value: '4096 87380 16777216' }
        - { name: 'net.ipv4.tcp_wmem', value: '4096 65536 16777216' }
        - { name: 'net.ipv4.tcp_max_syn_backlog', value: '8192' }     # SYN队列长度
        - { name: 'net.core.somaxconn', value: '1024' }               # 监听队列长度
        - { name: 'net.ipv4.tcp_slow_start_after_idle', value: '0' }  # 禁用慢启动
        - { name: 'net.ipv4.tcp_tw_reuse', value: '1' }               # 启用TIME_WAIT重用
        
        # 文件系统优化
        - { name: 'fs.file-max', value: '65536' }                     # 最大文件句柄数
        - { name: 'fs.inotify.max_user_watches', value: '524288' }    # inotify监控数
        
        # 内存管理优化（2G内存配置）
        - { name: 'vm.swappiness', value: '10' }                      # 降低swap使用
        - { name: 'vm.dirty_ratio', value: '15' }                     # 脏页比例15%
        - { name: 'vm.dirty_background_ratio', value: '5' }           # 后台写入比例5%
        - { name: 'vm.overcommit_memory', value: '1' }                # 允许内存超额分配
      tags: ['sysctl', 'performance']
      ignore_errors: yes  # BBR可能在某些内核版本不可用
    
    # --------------------------------------------------------------------------
    # 安全和维护工具
    # --------------------------------------------------------------------------
    - name: "手动任务 | 安装 Fail2Ban（需要 EPEL 仓库）"
      ansible.builtin.dnf:
        name: fail2ban
        state: present
      tags: ['fail2ban', 'security']
    
    - name: "手动任务 | 安装 ACL 工具（用于权限清理）"
      ansible.builtin.dnf:
        name: acl
        state: present
      tags: ['acl', 'security']
    
    - name: "手动任务 | 启动并启用 Fail2Ban 服务"
      ansible.builtin.systemd:
        name: fail2ban
        state: started
        enabled: true
      tags: ['fail2ban', 'security']
    
    - name: "手动任务 | 确保 Chronyd 服务正在运行（Rocky Linux 默认已安装）"
      ansible.builtin.systemd:
        name: chronyd
        state: started
        enabled: true
      tags: ['ntp', 'time']
    
    - name: "手动任务 | 设置系统时区为 Asia/Shanghai"
      ansible.builtin.timezone:
        name: Asia/Shanghai
      tags: ['ntp', 'time']
    
    # --------------------------------------------------------------------------
    # 权限配置：将 nginx 用户加入 apache 组（关键！）
    # 这样 Nginx 可以通过组权限访问 apache 用户的文件
    # --------------------------------------------------------------------------
    - name: "权限配置 | 将 nginx 用户添加到 apache 组"
      ansible.builtin.user:
        name: nginx
        groups: apache
        append: yes
      tags: ['permissions', 'users']
  
  # ============================================================================
  # 后置任务：安装 WP-CLI 和验证环境
  # ============================================================================
  post_tasks:
    # --------------------------------------------------------------------------
    # 从 Gitee 国内镜像下载 WP-CLI（解决下载速度慢问题）
    # 镜像源: https://gitee.com/fuckgitee2speed/wp-bare-metal-mirrors
    # --------------------------------------------------------------------------
    
    # 首先删除可能存在的损坏文件
    - name: "后置任务 | 清理可能损坏的旧 WP-CLI 文件"
      ansible.builtin.file:
        path: "/usr/local/bin/wp"
        state: absent
      tags: ['wp-cli']
    
    - name: "后置任务 | 从 Gitee 镜像下载 WP-CLI"
      ansible.builtin.get_url:
        url: "https://gitee.com/fuckgitee2speed/wp-bare-metal-mirrors/raw/main/wp-cli.phar"
        dest: "/usr/local/bin/wp"
        mode: '0755'
        timeout: 180
      register: wpcli_download
      retries: 3
      delay: 5
      until: wpcli_download is succeeded
      tags: ['wp-cli']
    
    # 验证文件是否真的存在且可执行
    - name: "后置任务 | 验证 WP-CLI 文件确实存在"
      ansible.builtin.stat:
        path: "/usr/local/bin/wp"
      register: wp_file_stat
      tags: ['wp-cli']
    
    - name: "后置任务 | 检查 WP-CLI 文件大小（确保不是错误页面）"
      ansible.builtin.fail:
        msg: "WP-CLI 文件太小（{{ wp_file_stat.stat.size }} 字节），可能下载的是错误页面。正常应该 >5MB"
      when: 
        - wp_file_stat.stat.exists
        - wp_file_stat.stat.size < 5000000
      tags: ['wp-cli']
    
    - name: "后置任务 | 检查下载是否失败"
      ansible.builtin.fail:
        msg: |
          WP-CLI 从 Gitee 镜像下载失败！
          
          错误信息: {{ wpcli_download.msg | default('未知错误') }}
          
          请检查：
          1. 服务器网络连接是否正常
          2. Gitee 镜像是否可访问: https://gitee.com/fuckgitee2speed/wp-bare-metal-mirrors
          3. 或手动上传 WP-CLI 到 /usr/local/bin/wp
      when: not wp_file_stat.stat.exists or wpcli_download.failed | default(false)
      tags: ['wp-cli']
    
    - name: "后置任务 | 验证 WP-CLI 可执行"
      ansible.builtin.command: /usr/local/bin/wp --info --allow-root
      register: wp_cli_info
      changed_when: false
      failed_when: wp_cli_info.rc != 0
      tags: ['wp-cli']
    
    - name: "后置任务 | 显示 WP-CLI 版本信息"
      ansible.builtin.debug:
        msg: "{{ wp_cli_info.stdout_lines }}"
      tags: ['wp-cli']
    
    - name: "后置任务 | 确保 PHP-FPM 服务正在运行"
      ansible.builtin.systemd:
        name: php-fpm
        state: started
        enabled: true
    
    - name: "后置任务 | 确保 Nginx 服务正在运行"
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: true
    
    - name: "后置任务 | 确保 MariaDB 服务正在运行"
      ansible.builtin.systemd:
        name: mariadb
        state: started
        enabled: true
    
    - name: "后置任务 | 测试数据库连接"
      ansible.builtin.command: >
        mysql -u {{ db_user }} -p'{{ db_password }}' {{ db_name }} -e "SELECT 1;"
      register: db_test
      changed_when: false
      failed_when: db_test.rc != 0
      no_log: true  # 不记录密码到日志
    
    - name: "完成 | 显示环境准备总结"
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "服务器环境准备完成！"
          - "=========================================="
          - "✓ EPEL 仓库已配置"
          - "✓ 防火墙已启用 (开放端口: 22, 80, 443)"
          - "✓ Fail2Ban 已启用 (SSH 保护)"
          - "✓ 时间已同步"
          - "✓ Nginx {{ nginx_version | default('latest') }} 已安装并运行"
          - "✓ PHP {{ php_version }} 已安装并运行"
          - "✓ MariaDB 已安装并运行"
          - "✓ WP-CLI 已安装"
          - "✓ 数据库 '{{ db_name }}' 已创建"
          - "✓ 数据库用户 '{{ db_user }}' 已授权"
          - "=========================================="
          - "下一步: 运行 playbook_step2_deploy_wordpress.yml"
          - "=========================================="

